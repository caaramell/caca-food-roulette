<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Caca's Food Roulette</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff7fb;
      margin: 0;
      padding: 30px 20px;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 25px;
    }

    button {
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      background: #eee;
    }

    button.active {
      background: #ff8fbd;
      color: white;
    }

    #count {
      text-align: center;
      margin-bottom: 20px;
      color: #777;
    }

    .restaurant-list {
      display: grid;
      gap: 15px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    .info {
      color: #666;
      margin: 7px 0;
    }

    .maps-button {
      display: inline-block;
      margin-top: 12px;
      padding: 9px 14px;
      background: #eee;
      border-radius: 10px;
      text-decoration: none;
      color: #333;
    }

    #loading {
      text-align: center;
      padding: 30px;
    }

    #error {
      text-align: center;
      color: #d33;
      padding: 20px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🍜 Caca's Food Roulette</h1>

    <p class="subtitle">
      Males milih makan dimana? Yaudah, biar nasib yang milih. 🎰
    </p>

    <div class="buttons">

      <button id="wantButton" class="active">
        💗 Want to Try
      </button>

      <button id="visitedButton">
        💚 Visited
      </button>

    </div>

    <div id="count"></div>

    <div id="loading">
      Lagi mengambil data restoran... 🍜
    </div>

    <div id="error"></div>

    <div id="restaurantList" class="restaurant-list"></div>

  </div>


  <script>

    const CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vRGeVKCr17Fo4yJfkrhh138fDmabvVz2n6X_U8Rt3de82bovXJe3t_VdTmTCyTva1dd7LsXLjJU755e/pub?gid=822459822&single=true&output=csv";


    let restaurants = [];

    let currentMode = "want";


    // =========================
    // MEMBACA CSV
    // =========================

    function parseCSV(text) {

      const rows = [];

      let row = [];

      let cell = "";

      let insideQuotes = false;


      for (let i = 0; i < text.length; i++) {

        const char = text[i];

        const nextChar = text[i + 1];


        if (char === '"' && insideQuotes && nextChar === '"') {

          cell += '"';

          i++;

        }

        else if (char === '"') {

          insideQuotes = !insideQuotes;

        }

        else if (char === "," && !insideQuotes) {

          row.push(cell);

          cell = "";

        }

        else if (
          (char === "\n" || char === "\r") &&
          !insideQuotes
        ) {

          if (char === "\r" && nextChar === "\n") {
            i++;
          }

          row.push(cell);

          rows.push(row);

          row = [];

          cell = "";

        }

        else {

          cell += char;

        }

      }


      if (cell !== "" || row.length > 0) {

        row.push(cell);

        rows.push(row);

      }


      return rows;

    }


    // =========================
    // NORMALISASI
    // =========================

    function normalize(text) {

      return String(text || "")
        .toLowerCase()
        .trim()
        .replace(/\s+/g, " ");

    }


    // =========================
    // MENCARI ISI KOLOM
    // =========================

    function getColumn(restaurant, columnName) {

      const header = Object.keys(restaurant).find(

        header =>
          normalize(header) === normalize(columnName)

      );


      if (!header) {
        return "";
      }


      return restaurant[header] || "";

    }


    // =========================
    // CEK SUDAH VISIT
    // =========================

    function isVisited(restaurant) {

      const status =
        normalize(
          getColumn(restaurant, "udah apa belom")
        );


      return (
        status.includes("sudah") ||
        status.includes("udah") ||
        status.includes("visited") ||
        status === "yes" ||
        status === "ya"
      );

    }


    // =========================
    // LOAD DATA
    // =========================

    async function loadRestaurants() {

      try {

        const response = await fetch(CSV_URL);


        if (!response.ok) {

          throw new Error(
            "Google Sheet tidak bisa dibaca."
          );

        }


        const text = await response.text();


        const rows = parseCSV(text);


        if (rows.length < 2) {

          throw new Error(
            "Data restoran masih kosong."
          );

        }


        const headers = rows[0];


        restaurants = rows
          .slice(1)
          .filter(row =>
            row.some(
              cell => String(cell).trim() !== ""
            )
          )
          .map(row => {

            const restaurant = {};


            headers.forEach(
              (header, index) => {

                restaurant[header] =
                  row[index] || "";

              }
            );


            return restaurant;

          });


        document.getElementById("loading")
          .style.display = "none";


        renderRestaurants();

      }


      catch (error) {

        document.getElementById("loading")
          .style.display = "none";


        document.getElementById("error")
          .textContent =
            "Aduh, datanya belum bisa dibaca 😭 " +
            error.message;


        console.error(error);

      }

    }


    // =========================
    // TAMPILKAN RESTORAN
    // =========================

    function renderRestaurants() {

      const list =
        document.getElementById(
          "restaurantList"
        );


      list.innerHTML = "";


      let filteredRestaurants;


      if (currentMode === "want") {

        filteredRestaurants =
          restaurants.filter(
            restaurant => !isVisited(restaurant)
          );

      }

      else {

        filteredRestaurants =
          restaurants.filter(
            restaurant => isVisited(restaurant)
          );

      }


      document.getElementById("count")
        .textContent =
          filteredRestaurants.length +
          " tempat";


      if (filteredRestaurants.length === 0) {

        list.innerHTML = `

          <div class="card">

            <h2>Belum ada data 😭</h2>

            <p>
              Coba cek lagi kolom
              "udah apa belom" di Google Sheet lo.
            </p>

          </div>

        `;

        return;

      }


      filteredRestaurants.forEach(
        restaurant => {


          const name =
            getColumn(
              restaurant,
              "nih tempatnya"
            );


          const category =
            getColumn(
              restaurant,
              "kategori"
            );


          const spotHere =
            getColumn(
              restaurant,
              "spot here"
            );


          const area =
            getColumn(
              restaurant,
              "area"
            );


          const visitStatus =
            getColumn(
              restaurant,
              "udah apa belom"
            );


          const foodRating =
            getColumn(
              restaurant,
              "f&b"
            );


          const ambience =
            getColumn(
              restaurant,
              "ambience"
            );


          const time =
            getColumn(
              restaurant,
              "time"
            );


          const revisit =
            getColumn(
              restaurant,
              "revisit?"
            );


          const mapsLink =
            spotHere &&
            (
              spotHere.startsWith("http://") ||
              spotHere.startsWith("https://")
            )
              ? spotHere
              : (
                "https://www.google.com/maps/search/?api=1&query=" +
                encodeURIComponent(
                  name + " " + spotHere
                )
              );


          const card =
            document.createElement("div");


          card.className = "card";


          card.innerHTML = `

            <h2>
              ${name || "Nama tempat belum ada"}
            </h2>


            ${
              category
                ? `<p class="info">
                    🍽️ Kategori: ${category}
                   </p>`
                : ""
            }


            ${
              area
                ? `<p class="info">
                    📍 Area: ${area}
                   </p>`
                : ""
            }


            ${
              foodRating
                ? `<p class="info">
                    ⭐ F&B: ${foodRating}
                   </p>`
                : ""
            }


            ${
              ambience
                ? `<p class="info">
                    ✨ Ambience: ${ambience}
                   </p>`
                : ""
            }


            ${
              time
                ? `<p class="info">
                    🕐 Time: ${time}
                   </p>`
                : ""
            }


            ${
              revisit
                ? `<p class="info">
                    🔄 Revisit: ${revisit}
                   </p>`
                : ""
            }


            ${
              visitStatus
                ? `<p class="info">
                    📋 Status: ${visitStatus}
                   </p>`
                : ""
            }


            ${
              spotHere
                ? `<a
                    class="maps-button"
                    href="${mapsLink}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    📍 Open Google Maps
                  </a>`
                : ""
            }

          `;


          list.appendChild(card);

        }
      );

    }


    // =========================
    // BUTTON WANT TO TRY
    // =========================

    document
      .getElementById("wantButton")
      .addEventListener(
        "click",
        function() {

          currentMode = "want";


          this.classList.add("active");


          document
            .getElementById("visitedButton")
            .classList.remove("active");


          renderRestaurants();

        }
      );


    // =========================
    // BUTTON VISITED
    // =========================

    document
      .getElementById("visitedButton")
      .addEventListener(
        "click",
        function() {

          currentMode = "visited";


          this.classList.add("active");


          document
            .getElementById("wantButton")
            .classList.remove("active");


          renderRestaurants();

        }
      );


    // =========================
    // MULAI
    // =========================

    loadRestaurants();

  </script>

</body>
</html>
