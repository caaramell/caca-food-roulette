<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caca's Food Roulette</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #fff8f2;
            margin: 0;
            padding: 50px 20px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            color: #666;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        button {
            border: none;
            padding: 20px 30px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        button:hover {
            transform: scale(1.05);
        }

        .spin {
            margin-top: 50px;
            background: #222;
            color: white;
            padding: 20px 50px;
            border-radius: 50px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🍜 Caca's Food Roulette</h1>

        <p>Males milih makan di mana?</p>
        <p>Yaudah, biar nasib yang milih. 🎰</p>

        <div class="buttons">
            <button>💗 Want to Try</button>
            <button>💚 Visited</button>
        </div>

        <button class="spin" onclick="spin()">🎰 SPIN</button>

    </div>
    
<script>
    function spin() {
        alert("🎰 BELUM ADA RESTORANNYA 😭\n\nTapi tombol SPIN lo sudah hidup!");
    }
</script>
    
</body>
</html>
